[workspace]
resolver = "2"
members = [
    "crates/quokka-core",
    "crates/quokka-driver",
    "crates/quokka-audit",
    "crates/quokka-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
# Not our floor — sqlx 0.9 requires it. CI pins this toolchain so the claim stays true.
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/ivypuckett/quokkaquery"
authors = ["QuokkaQuery contributors"]

[workspace.dependencies]
quokka-core = { path = "crates/quokka-core", version = "0.0.1" }
quokka-driver = { path = "crates/quokka-driver", version = "0.0.1" }
quokka-audit = { path = "crates/quokka-audit", version = "0.0.1" }

anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
futures = "0.3"
hex = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlparser = { version = "0.63", features = ["visitor"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal"] }
toml = "0.9"
uuid = { version = "1", features = ["v7", "serde"] }

tempfile = "3"
