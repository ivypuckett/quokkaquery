[workspace]
resolver = "2"
members = [
    "crates/quokka-core",
    "crates/quokka-driver",
    "crates/quokka-audit",
    "crates/quokka-spool",
    "crates/quokka-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
# Not our floor — sqlx 0.9 requires it. CI pins this toolchain so the claim stays true.
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/ivypuckett/quokkaquery"
authors = ["QuokkaQuery contributors"]

[workspace.dependencies]
quokka-core = { path = "crates/quokka-core", version = "0.0.1" }
quokka-driver = { path = "crates/quokka-driver", version = "0.0.1" }
quokka-audit = { path = "crates/quokka-audit", version = "0.0.1" }
quokka-spool = { path = "crates/quokka-spool", version = "0.0.1" }

anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
futures = "0.3"
hex = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlparser = { version = "0.63", features = ["visitor"] }
# `tls-rustls-ring-native-roots`, not native-tls: §3.0 wants no linking against system
# client libraries, and rustls is pure Rust. The *roots* still come from the OS trust
# store, because the databases people actually connect to are as often behind a company
# CA as behind a public one, and a bundled root set cannot see those.
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "tls-rustls-ring-native-roots",
] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal"] }
toml = "0.9"
uuid = { version = "1", features = ["v7", "serde"] }

# Credentials (§5). `keyring` 4.x is a thin facade over `keyring-core` whose `v1`
# feature picks the OS store per platform — Keychain, Credential Manager, Secret
# Service over zbus (pure Rust; the libdbus-linking store is a different feature we do
# not enable). The rest is the encrypted-file fallback for a headless box with no
# Secret Service: XChaCha20-Poly1305 over an Argon2id-derived key, both pure Rust.
keyring = "4"
argon2 = "0.6"
chacha20poly1305 = "0.11"
getrandom = "0.4"
rpassword = "7"
zeroize = "1"

# Parquet export (§4), behind quokka-spool's default-on `parquet` feature. Default
# features are off so the `zstd` and `lz4` codecs — which are C bindings — stay out of
# the tree; `snap` is pure Rust, and everything here is Apache-2.0 or BSD-3-Clause.
arrow-array = { version = "56", default-features = false }
arrow-schema = { version = "56", default-features = false }
parquet = { version = "56", default-features = false, features = ["arrow", "snap"] }

tempfile = "3"
# Container-backed tests only (§9), behind quokka-driver's `docker-tests` feature.
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres", "mysql"] }
