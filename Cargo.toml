[workspace]
resolver = "2"
members = [
    "crates/quokka-core",
    "crates/quokka-driver",
    "crates/quokka-audit",
    "crates/quokka-spool",
    "crates/quokka-policy",
    "crates/quokka-mcp",
    "crates/quokka-cli",
    "crates/quokka-ui",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
# Not our floor — sqlx 0.9 requires it. CI pins this toolchain so the claim stays true.
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/ivypuckett/quokkaquery"
authors = ["QuokkaQuery contributors"]

[workspace.dependencies]
quokka-core = { path = "crates/quokka-core", version = "0.0.1" }
quokka-driver = { path = "crates/quokka-driver", version = "0.0.1" }
quokka-audit = { path = "crates/quokka-audit", version = "0.0.1" }
quokka-spool = { path = "crates/quokka-spool", version = "0.0.1" }
quokka-policy = { path = "crates/quokka-policy", version = "0.0.1" }
quokka-mcp = { path = "crates/quokka-mcp", version = "0.0.1" }
quokka-ui = { path = "crates/quokka-ui", version = "0.0.1" }

anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
futures = "0.3"
hex = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlparser = { version = "0.63", features = ["visitor"] }
# The MCP server (§6.2). Apache-2.0, pure Rust, and taken without default features so
# only the stdio transport and the server half of the SDK reach the tree.
rmcp = { version = "3", default-features = false }
# rmcp derives its tool schemas with this, and the derive macro resolves `schemars::`
# from the using crate — so it is a direct dependency rather than one reached through
# `rmcp::schemars`. Pinned to the same major version rmcp asks for; two of them in the
# tree would produce two incompatible `JsonSchema` traits and a very confusing error.
schemars = "1"
# `tls-rustls-ring-native-roots`, not native-tls: §3.0 wants no linking against system
# client libraries, and rustls is pure Rust. The *roots* still come from the OS trust
# store, because the databases people actually connect to are as often behind a company
# CA as behind a public one, and a bundled root set cannot see those.
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "tls-rustls-ring-native-roots",
] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal"] }
toml = "0.9"
uuid = { version = "1", features = ["v7", "serde"] }

# Credentials (§5). `keyring` 4.x is a thin facade over `keyring-core` whose `v1`
# feature picks the OS store per platform — Keychain, Credential Manager, Secret
# Service over zbus (pure Rust; the libdbus-linking store is a different feature we do
# not enable). The rest is the encrypted-file fallback for a headless box with no
# Secret Service: XChaCha20-Poly1305 over an Argon2id-derived key, both pure Rust.
keyring = "4"
argon2 = "0.6"
chacha20poly1305 = "0.11"
getrandom = "0.4"
rpassword = "7"
zeroize = "1"

# Parquet export (§4), behind quokka-spool's default-on `parquet` feature. Default
# features are off so the `zstd` and `lz4` codecs — which are C bindings — stay out of
# the tree; `snap` is pure Rust, and everything here is Apache-2.0 or BSD-3-Clause.
arrow-array = { version = "56", default-features = false }
arrow-schema = { version = "56", default-features = false }
parquet = { version = "56", default-features = false, features = ["arrow", "snap"] }

# Athena (§3.2), behind quokka-driver's `athena` feature. Apache-2.0, pure Rust — with
# one decision that is not the default and has to be made deliberately.
#
# **The TLS provider is the trap.** `aws-config` and every `aws-sdk-*` crate default to
# `default-https-client`, which resolves to `aws-smithy-http-client/rustls-aws-lc` and
# pulls `aws-lc-sys`: a C library wanting a C compiler *and* cmake, which §8 says this
# project does not require. So default features are off everywhere here and the HTTPS
# client is built by hand from `aws-smithy-http-client` with `rustls-ring` — the same
# rustls-over-ring stack `sqlx`'s `tls-rustls-ring-native-roots` already puts in the
# tree, and the same native root store, for the reason the sqlx comment above gives.
# Checked rather than assumed: `cargo tree` carries no `aws-lc-sys` and no new `-sys`
# crate at all, and CI guards it (see the `athena` job).
#
# `sso` is what M5 is for: `aws-config` resolves `sso_session` profiles from
# `~/.aws/config` and the token cache `aws sso login` writes, refresh included. It pulls
# `aws-sdk-sso` and `aws-sdk-ssooidc`, which is *not* the in-process OIDC device flow —
# that is M7 and would be us driving `ssooidc` ourselves.
aws-config = { version = "1", default-features = false, features = ["rt-tokio", "sso"] }
aws-sdk-athena = { version = "1", default-features = false, features = ["rt-tokio"] }
aws-smithy-http-client = { version = "1", default-features = false, features = [
    "rustls-ring",
] }
aws-smithy-runtime-api = { version = "1", default-features = false, features = ["client"] }
aws-smithy-types = { version = "1", default-features = false }
aws-credential-types = { version = "1", default-features = false }
aws-types = { version = "1", default-features = false }

tempfile = "3"
# The recorded HTTP fixtures §9 asks for, so the Athena driver is tested without Athena.
# A dev-dependency of `quokka-driver` only: a local listener serving recorded JSON is
# not a server, and the README says so.
wiremock = "0.6"
# Container-backed tests only (§9), behind quokka-driver's `docker-tests` feature.
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres", "mysql"] }
