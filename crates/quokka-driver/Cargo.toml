[package]
name = "quokka-driver"
description = "QuokkaQuery drivers: the Driver trait's implementations, one cargo feature per database"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["sqlite"]
sqlite = ["sqlx/sqlite"]
postgres = ["sqlx/postgres"]
# `mysql-rsa` is not optional in practice. MySQL 8 defaults to the
# `caching_sha2_password` auth plugin, and on a connection with no TLS the client has to
# fetch the server's RSA public key to encrypt the password — sqlx puts that behind this
# feature, and without it every MySQL 8 connection over plaintext fails to authenticate.
# MariaDB still defaults to `mysql_native_password`, which is why this does not show up
# until a real MySQL 8 is on the other end. The `rsa` crate is RustCrypto: pure Rust,
# MIT/Apache-2.0, no C and no GPL.
mysql = ["sqlx/mysql", "sqlx/mysql-rsa"]
# Athena (§3.2). Its own feature like every other driver (§3.0, hedge 2), and the only
# one that is not a wire protocol: a hand-written driver over `aws-sdk-athena`, which is
# what hedge 2 says the trait seam has to tolerate. The AWS crates are optional so a
# build that does not ask for Athena carries none of them.
athena = [
    "dep:aws-config",
    "dep:aws-sdk-athena",
    "dep:aws-smithy-http-client",
    "dep:aws-smithy-runtime-api",
    "dep:aws-smithy-types",
    "dep:aws-credential-types",
    "dep:aws-types",
    "tokio/time",
]
# The container-backed tests of §9, which need Docker and therefore must not run in the
# default `cargo test`. Cargo does not allow an *optional* dev-dependency, so
# `testcontainers` is an optional normal dependency instead and the test file that uses
# it is `#[cfg]`-gated on this feature. Nothing in the library ever refers to it.
docker-tests = ["postgres", "mysql", "dep:testcontainers", "dep:testcontainers-modules"]

[dependencies]
quokka-core.workspace = true
# For the statement *count* only, in the one driver whose protocol lets a stacked body
# through (see `sqlite::execute`). A leaf crate of pure functions with no I/O, so this
# does not give a driver a way to reach anything.
quokka-policy.workspace = true

async-trait.workspace = true
futures.workspace = true
sqlx = { workspace = true, default-features = false, features = ["runtime-tokio"] }
tokio = { workspace = true }
uuid.workspace = true

aws-config = { workspace = true, optional = true }
aws-sdk-athena = { workspace = true, optional = true }
aws-smithy-http-client = { workspace = true, optional = true }
aws-smithy-runtime-api = { workspace = true, optional = true }
aws-smithy-types = { workspace = true, optional = true }
aws-credential-types = { workspace = true, optional = true }
aws-types = { workspace = true, optional = true }

testcontainers = { workspace = true, optional = true }
testcontainers-modules = { workspace = true, optional = true }

[dev-dependencies]
quokka-audit.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["sqlite"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
# The recorded HTTP fixtures of §9. LocalStack's Athena support is not in its community
# edition, so a local listener replaying recorded JSON is the honest substitute — and a
# recorded fixture is not a server, which the README says in as many words.
wiremock.workspace = true
