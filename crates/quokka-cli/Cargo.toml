[package]
name = "quokkaquery"
description = "A single-user database client for agents and humans, with one append-only audit log of every query"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "quokka"
path = "src/main.rs"

[features]
# The window is default-on, so `cargo install quokkaquery` gets a UI, and separable, so
# `--no-default-features` yields a headless CLI with no wgpu/winit/iced anywhere in the
# tree (CLAUDE.md) — which is what you want in a container, in CI, or on an agent's box.
# CI asserts both halves: that the headless tree carries no GUI dependency, and that the
# default tree *does* carry iced, so the feature cannot silently switch off.
#
# Note what is *not* behind a feature here: the drivers. `--no-default-features` exists
# to drop the GUI stack, and a headless Postgres client is the most useful thing that
# build could be. One cargo feature per driver (§3.0, hedge 2) lives on `quokka-driver`,
# where a slim build asks for it by name.
default = ["ui"]
ui = ["dep:quokka-ui"]

[dependencies]
quokka-audit.workspace = true
quokka-core.workspace = true
quokka-mcp.workspace = true
quokka-driver = { workspace = true, features = ["sqlite", "postgres", "mysql"] }
# Parquet asked for by name rather than inherited, so `cargo install quokkaquery
# --no-default-features` — which exists to drop the GUI stack for a container or an
# agent's box — still writes Parquet. See quokka-spool's manifest for the rest.
quokka-spool = { workspace = true, features = ["parquet"] }
# The window (§7). Optional and default-on: this is the only crate that may depend on
# `quokka-ui`, and `quokka-ui` depends on nothing but `quokka-core` and `quokka-spool`.
quokka-ui = { workspace = true, optional = true }

anyhow.workspace = true
clap.workspace = true
futures.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
uuid.workspace = true

[dev-dependencies]
quokka-driver = { workspace = true, features = ["sqlite"] }
quokka-spool = { workspace = true }
rmcp = { workspace = true, default-features = false, features = ["server", "macros"] }
serde_json.workspace = true
sqlx = { workspace = true, features = ["sqlite"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
