# The gate CLAUDE.md's conventions describe: fmt, clippy -D warnings and tests clean,
# with no Docker anywhere. ARCHITECTURE §8's release matrix — musl, cargo-dist,
# installers — lands at M6; this is only what keeps the tree honest in the meantime.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the run in flight for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A backtrace on a CI failure is worth more than the noise it costs.
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      # --all-targets so tests and examples are linted too, not just the libraries, and
      # --all-features so the container-backed tests are compiled and linted here even
      # though they are run in the `containers` job below.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Deliberately *not* --all-features: that would switch on quokka-driver's
      # `docker-tests`, and CLAUDE.md says the default `cargo test` must pass with no
      # Docker. Every driver is still built, because the CLI depends on all four.
      #
      # This includes the Athena driver and its recorded fixtures (§9): they replay
      # JSON over a listener on loopback, so they need no Docker, no network and no AWS
      # credentials — which is the whole point of them, and the reason they are not in
      # a job of their own.
      - name: cargo test
        run: cargo test --workspace

  platforms:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # arm64 macOS and Windows alongside the Linux job above. Windows needs the MSVC
        # build tools for libsqlite3-sys, which the runner image already carries (§8).
        # x86_64 macOS and musl add nothing a Rust build breaks differently on; they
        # belong to M6's release matrix, where the artifacts are what is being proved.
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace

  containers:
    name: container-backed driver tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      # ARCHITECTURE §9: Postgres and MySQL are tested against real servers via
      # testcontainers, behind a feature so the jobs above need no Docker. This is the
      # one place the wire-protocol drivers meet a real server — whether an hstore
      # degrades to a string rather than aborting a result set, whether
      # `default_transaction_read_only` actually refuses a write, whether a rejected
      # password stays out of the error text. None of those can be checked against a
      # fake, so if this job stops running, the drivers stop being tested.
      #
      # Docker is preinstalled on the GitHub-hosted ubuntu runners, so there is nothing
      # to set up here.
      - name: cargo test --features docker-tests
        run: cargo test --package quokka-driver --features docker-tests

  athena:
    name: the Athena driver, and the build dependency it must not add
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      # §8 says the C compiler `sqlx-sqlite` needs is the only build dependency, and M4
      # confirmed the window adds none. The AWS SDK is the first dependency that could
      # put a C toolchain back: every `aws-sdk-*` crate defaults to `rustls-aws-lc`,
      # which pulls `aws-lc-sys` — C *and* cmake. The workspace takes them with
      # `default-features = false` and builds the HTTPS client over rustls+ring
      # instead, which is the stack sqlx already carries.
      #
      # Checked rather than claimed, the way M4 did the licence audit. This guard is
      # what stops a casual `default-features = true` reinstating cmake for everyone.
      - name: no aws-lc-sys, and no new -sys crate, in the default tree
        run: |
          set -euo pipefail
          tree=$(cargo tree --package quokkaquery --edges normal)
          if grep -Eiq '\b(aws-lc-sys|aws-lc-rs|aws-lc-fips-sys|s2n-tls-sys)\b' <<<"$tree"; then
            echo "::error::a C-linking TLS stack reached the tree; Athena must use rustls+ring:"
            grep -Ei '\b(aws-lc-sys|aws-lc-rs|aws-lc-fips-sys|s2n-tls-sys)\b' <<<"$tree"
            exit 1
          fi
          # The complete list of `-sys` crates §8 accounts for. A new one is not
          # necessarily wrong, but it is a change to the documented build dependencies,
          # so it has to be a decision rather than a surprise.
          expected="dirs-sys libsqlite3-sys linux-raw-sys renderdoc-sys wayland-sys"
          found=$(cargo tree --package quokkaquery --edges normal --prefix none \
            | awk '{print $1}' | grep -E -- '-sys$' | sort -u || true)
          for crate in $found; do
            case " $expected " in
              *" $crate "*) ;;
              *)
                echo "::error::a -sys crate appeared that §8 does not account for: $crate"
                exit 1
                ;;
            esac
          done
          echo "no new -sys crate; §8's build-dependency list still holds"

      # The driver is behind its own cargo feature like every other one (§3.0, hedge 2),
      # so a build that asks for Athena alone has to work — the slim build the hedge
      # exists for.
      - name: quokka-driver with athena alone
        run: cargo test --package quokka-driver --no-default-features --features athena

      # And a build that does *not* ask for it carries none of the AWS SDK.
      - name: without the feature, no AWS SDK at all
        run: |
          set -euo pipefail
          tree=$(cargo tree --package quokka-driver --no-default-features --features sqlite --edges normal)
          if grep -Eiq '\b(aws-config|aws-sdk-athena|aws-smithy)' <<<"$tree"; then
            echo "::error::the AWS SDK reached a build that did not ask for Athena:"
            grep -Ei '\b(aws-config|aws-sdk-athena|aws-smithy)' <<<"$tree"
            exit 1
          fi
          echo "one crate and one cargo feature per driver, still true"

  mcp:
    name: the MCP server speaks the protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      # The tool tests in `quokka-mcp` call the tools directly, which is the right level
      # for the claims they make — one execution per result, a denial denied identically
      # here and at the CLI. What they cannot check is that the *transport* works: that
      # `quokka mcp` speaks JSON-RPC over stdio, that its schemas serialize, and that
      # nothing but protocol reaches stdout. A handshake and two calls over a real pipe
      # cover exactly that gap, and it is the failure a user would meet first.
      - name: a real client handshake over stdio
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          python3 - "$work" <<'PY'
          import sqlite3, sys
          db = sys.argv[1] + "/app.db"
          c = sqlite3.connect(db)
          c.execute("CREATE TABLE orders (id INTEGER PRIMARY KEY, total REAL)")
          c.executemany("INSERT INTO orders VALUES (?, ?)", [(i, i * 1.5) for i in range(1, 600)])
          c.commit()
          c.close()
          PY
          cat > "$work/config.toml" <<EOF
          [connections.app]
          driver = "sqlite"
          path = "$work/app.db"
          credential = "none"
          EOF
          cat > "$work/calls.jsonl" <<'EOF'
          {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}
          {"jsonrpc":"2.0","method":"notifications/initialized"}
          {"jsonrpc":"2.0","id":2,"method":"tools/list"}
          {"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"query","arguments":{"connection":"app","sql":"SELECT * FROM orders"}}}
          {"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"query","arguments":{"connection":"app","sql":"DELETE FROM orders","write":true}}}
          EOF
          cargo build --package quokkaquery
          QUOKKA_CONFIG="$work/config.toml"           QUOKKA_AUDIT_DB="$work/audit.db"           QUOKKA_CACHE_DIR="$work/cache"             ./target/debug/quokka mcp < "$work/calls.jsonl" > "$work/out.jsonl"
          python3 - "$work/out.jsonl" <<'PY'
          import json, sys

          by_id = {}
          for line in open(sys.argv[1]):
              line = line.strip()
              if not line:
                  continue
              # Anything that is not JSON-RPC on stdout is corruption of the transport.
              message = json.loads(line)
              if "id" in message:
                  by_id[message["id"]] = message

          assert by_id[1]["result"]["serverInfo"]["name"] == "quokkaquery", by_id[1]
          names = sorted(t["name"] for t in by_id[2]["result"]["tools"])
          assert names == [
              "describe_table", "explain", "export", "list_connections",
              "list_schemas", "query", "search_audit",
          ], names

          page = json.loads(by_id[3]["result"]["content"][0]["text"])
          assert len(page["rows"]) == 512, len(page["rows"])
          assert page["rows_in_view"] == 599, page["rows_in_view"]
          assert page["next_cursor"], "a second page should be reachable"

          denied = by_id[4]["error"]
          assert denied["data"]["code"] == "policy.read_only", denied
          print("the MCP transport works, the cap holds, and a write is refused")
          PY

  headless:
    name: headless build has no GUI dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      - name: cargo build --no-default-features
        run: cargo build --workspace --no-default-features

      # CLAUDE.md: `--no-default-features` must always yield a working headless CLI with
      # no wgpu/winit in the tree. This was trivially true until M4; it is the guard that
      # commit existed to meet, and from here on it is load-bearing.
      # Note the here-strings. Piping into `grep -q` looks equivalent and is not: a
      # match makes grep exit immediately, `echo` takes SIGPIPE, and `pipefail` then
      # reports the whole pipeline as failed. For this check that means the guard fails
      # *open* — a GUI dependency would make grep match, the pipeline "fail", and the
      # `if` go false, so the error would never be printed. A here-string has no pipe
      # and no second process to kill.
      - name: no wgpu/winit in the headless tree
        run: |
          set -euo pipefail
          tree=$(cargo tree --package quokkaquery --no-default-features --edges normal)
          if grep -Eiq '\b(wgpu|winit|webkit2gtk|iced)' <<<"$tree"; then
            echo "::error::a GUI dependency reached the headless build:"
            grep -Ei '\b(wgpu|winit|webkit2gtk|iced)' <<<"$tree"
            exit 1
          fi
          echo "headless tree is clean"

      - name: the headless binary runs
        run: cargo run --package quokkaquery --no-default-features -- --version

      # `quokka ui` still parses in a headless build, so asking for it gets an
      # explanation rather than "unrecognized subcommand". The subcommand is the
      # discoverable place to say which build you have.
      - name: the headless build explains that it has no window
        run: |
          set -euo pipefail
          if cargo run --quiet --package quokkaquery --no-default-features -- ui \
              2>"$RUNNER_TEMP/ui.err"; then
            echo "::error::a headless build opened a window"
            exit 1
          fi
          if ! grep -q -- "--no-default-features" "$RUNNER_TEMP/ui.err"; then
            echo "::error::the refusal should say which build this is:"
            cat "$RUNNER_TEMP/ui.err"
            exit 1
          fi
          cat "$RUNNER_TEMP/ui.err"

      # Parquet export is default-on and asked for by name in the CLI's manifest, so
      # dropping the CLI's default features must NOT drop it: `--no-default-features`
      # exists to shed the GUI stack for a container, and a container is where writing
      # Parquet is most useful. This is the guard on that decision.
      # The other half of a default-on feature: a guard that only checks the *absence* of
      # the GUI lets the feature quietly switch off and still pass. `cargo install
      # quokkaquery` is supposed to get a window, so the default tree has to carry one.
      - name: the default build carries the window
        run: |
          set -euo pipefail
          tree=$(cargo tree --package quokkaquery --edges normal)
          for crate in iced iced_table wgpu winit; do
            if ! grep -Eq "\b${crate} v[0-9]" <<<"$tree"; then
              echo "::error::the default build lost $crate; did the ui feature stop being default?"
              exit 1
            fi
          done
          echo "the default tree carries the window"

      - name: the headless build still writes parquet
        run: |
          set -euo pipefail
          tree=$(cargo tree --package quokkaquery --no-default-features --edges normal)
          if ! grep -q "parquet" <<<"$tree"; then
            echo "::error::the headless build lost parquet export"
            exit 1
          fi
          echo "headless tree still carries parquet"

      # And the other half of that decision: arrow stays separable, so a consumer that
      # only needs CSV can drop ~60 crates. A feature nobody checks stops working.
      - name: quokka-spool without parquet has no arrow
        run: |
          set -euo pipefail
          cargo build --package quokka-spool --no-default-features
          tree=$(cargo tree --package quokka-spool --no-default-features --edges normal)
          if grep -Eiq '\b(arrow|arrow-array|arrow-schema|parquet|thrift)\b' <<<"$tree"; then
            echo "::error::arrow reached a build that switched parquet off:"
            grep -Ei '\b(arrow|arrow-array|arrow-schema|parquet|thrift)\b' <<<"$tree"
            exit 1
          fi
          echo "the no-parquet spool tree is clean"

      # The drivers are not behind a CLI feature, so the headless build is a full
      # database client rather than a SQLite-only one. Checking it here keeps that a
      # decision rather than an accident.
      - name: the headless build still carries every driver
        run: |
          set -euo pipefail
          tree=$(cargo tree --package quokkaquery --no-default-features --edges normal)
          for driver in sqlite postgres mysql; do
            if ! grep -q "sqlx-$driver" <<<"$tree"; then
              echo "::error::the headless build dropped the $driver driver"
              exit 1
            fi
          done
          # Athena is not a sqlx driver, so it is checked by the crate it is built on.
          # A headless container is exactly where querying Athena is most useful, so
          # dropping the GUI stack must not drop it.
          if ! grep -q "aws-sdk-athena" <<<"$tree"; then
            echo "::error::the headless build dropped the athena driver"
            exit 1
          fi
          echo "headless tree carries sqlite, postgres, mysql and athena"

  window:
    name: the window opens and runs a query
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      # ARCHITECTURE §9 says the UI's test story is smoke tests, because the logic lives
      # in `quokka-core` and `quokka-spool` where it can be tested properly. This is that
      # smoke test, and it is the one claim the unit tests cannot make: that the window
      # actually opens, that a query typed into it runs, and that it lands in the log as
      # a `ui` query. Everything else about the UI is asserted in `quokka-ui/tests`,
      # which never opens a window.
      #
      # Xvfb with the software renderer, because a GitHub runner has no GPU — which also
      # exercises §7's `tiny-skia` fallback on every run rather than only on the machines
      # that need it. `libxkbcommon-x11-0` is a *runtime* dependency winit dlopens; the
      # build needs no system package at all, which is why nothing above installs one.
      - name: a virtual display, and what winit loads at runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             xvfb xdotool x11-apps libxkbcommon-x11-0

      - name: cargo build
        run: cargo build --package quokkaquery

      - name: open it, type a query, and look in the log
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          python3 - "$work" <<'PY'
          import sqlite3, sys
          db = sys.argv[1] + "/app.db"
          c = sqlite3.connect(db)
          c.execute("CREATE TABLE orders (id INTEGER PRIMARY KEY, total REAL)")
          c.executemany("INSERT INTO orders VALUES (?, ?)", [(i, i * 1.5) for i in range(1, 1201)])
          c.commit()
          c.close()
          PY
          cat > "$work/config.toml" <<EOF
          [connections.app]
          driver = "sqlite"
          path = "$work/app.db"
          credential = "none"
          EOF

          export DISPLAY=:99
          Xvfb :99 -screen 0 1400x900x24 >"$work/xvfb.log" 2>&1 &
          sleep 2

          export QUOKKA_CONFIG="$work/config.toml"
          export QUOKKA_AUDIT_DB="$work/audit.db"
          export QUOKKA_CACHE_DIR="$work/cache"
          ./target/debug/quokka ui --renderer software >"$work/ui.log" 2>&1 &
          ui=$!

          # The window, not a timer: a slow runner should wait, not fail.
          window=""
          for _ in $(seq 1 90); do
            window="$(xdotool search --name QuokkaQuery | head -1 || true)"
            if [ -n "$window" ]; then break; fi
            sleep 1
          done
          if [ -z "$window" ]; then
            echo "::error::no window appeared"
            cat "$work/ui.log"
            exit 1
          fi
          echo "window: $(xdotool getwindowname "$window")"

          # The window is at 0,0 with no window manager, and it is 1280x820, so this
          # lands in the editor. Typed through XTEST so winit sees real key events.
          xdotool windowfocus --sync "$window"
          sleep 2
          xdotool mousemove 700 150
          xdotool click 1
          sleep 2
          xdotool type --delay 60 "SELECT * FROM orders"
          sleep 1
          xdotool key ctrl+Return

          # Poll the log rather than sleeping a guess.
          found=""
          for _ in $(seq 1 60); do
            if ./target/debug/quokka audit tail -n 20 --format json 2>/dev/null                 | python3 -c "
          import json, sys
          page = json.load(sys.stdin)
          rows = page['rows']
          ok = [r for r in rows
                if r['client'] == 'ui' and r['event_kind'] == 'query_finished'
                and r['status'] == 'ok' and r['rows_returned'] == 1200]
          sys.exit(0 if ok else 1)
          "; then
              found=yes
              break
            fi
            sleep 1
          done

          kill "$ui" 2>/dev/null || true
          sleep 2
          kill -9 "$ui" 2>/dev/null || true

          if [ -z "$found" ]; then
            echo "::error::the window opened but the query never reached the log"
            ./target/debug/quokka audit tail -n 20 || true
            cat "$work/ui.log"
            exit 1
          fi
          echo "the window opened, ran a query, and the log says so"

  msrv:
    name: builds on the declared rust-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Keep this in step with `rust-version` in the workspace Cargo.toml. An MSRV
      # nobody checks quietly stops being true — this one already had.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features
