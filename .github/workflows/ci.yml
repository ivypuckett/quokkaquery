# The gate CLAUDE.md's conventions describe: fmt, clippy -D warnings and tests clean,
# with no Docker anywhere. ARCHITECTURE §8's release matrix — musl, cargo-dist,
# installers — lands at M6; this is only what keeps the tree honest in the meantime.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the run in flight for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A backtrace on a CI failure is worth more than the noise it costs.
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      # --all-targets so tests and examples are linted too, not just the libraries, and
      # --all-features so the container-backed tests are compiled and linted here even
      # though they are run in the `containers` job below.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Deliberately *not* --all-features: that would switch on quokka-driver's
      # `docker-tests`, and CLAUDE.md says the default `cargo test` must pass with no
      # Docker. Every driver is still built, because the CLI depends on all three.
      - name: cargo test
        run: cargo test --workspace

  platforms:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # arm64 macOS and Windows alongside the Linux job above. Windows needs the MSVC
        # build tools for libsqlite3-sys, which the runner image already carries (§8).
        # x86_64 macOS and musl add nothing a Rust build breaks differently on; they
        # belong to M6's release matrix, where the artifacts are what is being proved.
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace

  containers:
    name: container-backed driver tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      # ARCHITECTURE §9: Postgres and MySQL are tested against real servers via
      # testcontainers, behind a feature so the jobs above need no Docker. This is the
      # one place the wire-protocol drivers meet a real server — whether an hstore
      # degrades to a string rather than aborting a result set, whether
      # `default_transaction_read_only` actually refuses a write, whether a rejected
      # password stays out of the error text. None of those can be checked against a
      # fake, so if this job stops running, the drivers stop being tested.
      #
      # Docker is preinstalled on the GitHub-hosted ubuntu runners, so there is nothing
      # to set up here.
      - name: cargo test --features docker-tests
        run: cargo test --package quokka-driver --features docker-tests

  mcp:
    name: the MCP server speaks the protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      # The tool tests in `quokka-mcp` call the tools directly, which is the right level
      # for the claims they make — one execution per result, a denial denied identically
      # here and at the CLI. What they cannot check is that the *transport* works: that
      # `quokka mcp` speaks JSON-RPC over stdio, that its schemas serialize, and that
      # nothing but protocol reaches stdout. A handshake and two calls over a real pipe
      # cover exactly that gap, and it is the failure a user would meet first.
      - name: a real client handshake over stdio
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          python3 - "$work" <<'PY'
          import sqlite3, sys
          db = sys.argv[1] + "/app.db"
          c = sqlite3.connect(db)
          c.execute("CREATE TABLE orders (id INTEGER PRIMARY KEY, total REAL)")
          c.executemany("INSERT INTO orders VALUES (?, ?)", [(i, i * 1.5) for i in range(1, 600)])
          c.commit()
          c.close()
          PY
          cat > "$work/config.toml" <<EOF
          [connections.app]
          driver = "sqlite"
          path = "$work/app.db"
          credential = "none"
          EOF
          cat > "$work/calls.jsonl" <<'EOF'
          {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}
          {"jsonrpc":"2.0","method":"notifications/initialized"}
          {"jsonrpc":"2.0","id":2,"method":"tools/list"}
          {"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"query","arguments":{"connection":"app","sql":"SELECT * FROM orders"}}}
          {"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"query","arguments":{"connection":"app","sql":"DELETE FROM orders","write":true}}}
          EOF
          cargo build --package quokkaquery
          QUOKKA_CONFIG="$work/config.toml"           QUOKKA_AUDIT_DB="$work/audit.db"           QUOKKA_CACHE_DIR="$work/cache"             ./target/debug/quokka mcp < "$work/calls.jsonl" > "$work/out.jsonl"
          python3 - "$work/out.jsonl" <<'PY'
          import json, sys

          by_id = {}
          for line in open(sys.argv[1]):
              line = line.strip()
              if not line:
                  continue
              # Anything that is not JSON-RPC on stdout is corruption of the transport.
              message = json.loads(line)
              if "id" in message:
                  by_id[message["id"]] = message

          assert by_id[1]["result"]["serverInfo"]["name"] == "quokkaquery", by_id[1]
          names = sorted(t["name"] for t in by_id[2]["result"]["tools"])
          assert names == [
              "describe_table", "explain", "export", "list_connections",
              "list_schemas", "query", "search_audit",
          ], names

          page = json.loads(by_id[3]["result"]["content"][0]["text"])
          assert len(page["rows"]) == 512, len(page["rows"])
          assert page["rows_in_view"] == 599, page["rows_in_view"]
          assert page["next_cursor"], "a second page should be reachable"

          denied = by_id[4]["error"]
          assert denied["data"]["code"] == "policy.read_only", denied
          print("the MCP transport works, the cap holds, and a write is refused")
          PY

  headless:
    name: headless build has no GUI dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      - name: cargo build --no-default-features
        run: cargo build --workspace --no-default-features

      # CLAUDE.md: `--no-default-features` must always yield a working headless CLI with
      # no wgpu/winit in the tree. Trivially true until `quokka-ui` arrives at M4, which
      # is exactly why the guard belongs here before it does — the commit that breaks
      # this is the one that adds the UI without gating it.
      # Note the here-strings. Piping into `grep -q` looks equivalent and is not: a
      # match makes grep exit immediately, `echo` takes SIGPIPE, and `pipefail` then
      # reports the whole pipeline as failed. For this check that means the guard fails
      # *open* — a GUI dependency would make grep match, the pipeline "fail", and the
      # `if` go false, so the error would never be printed. A here-string has no pipe
      # and no second process to kill.
      - name: no wgpu/winit in the headless tree
        run: |
          set -euo pipefail
          tree=$(cargo tree --package quokkaquery --no-default-features --edges normal)
          if grep -Eiq '\b(wgpu|winit|webkit2gtk|iced)' <<<"$tree"; then
            echo "::error::a GUI dependency reached the headless build:"
            grep -Ei '\b(wgpu|winit|webkit2gtk|iced)' <<<"$tree"
            exit 1
          fi
          echo "headless tree is clean"

      - name: the headless binary runs
        run: cargo run --package quokkaquery --no-default-features -- --version

      # Parquet export is default-on and asked for by name in the CLI's manifest, so
      # dropping the CLI's default features must NOT drop it: `--no-default-features`
      # exists to shed the GUI stack for a container, and a container is where writing
      # Parquet is most useful. This is the guard on that decision.
      - name: the headless build still writes parquet
        run: |
          set -euo pipefail
          tree=$(cargo tree --package quokkaquery --no-default-features --edges normal)
          if ! grep -q "parquet" <<<"$tree"; then
            echo "::error::the headless build lost parquet export"
            exit 1
          fi
          echo "headless tree still carries parquet"

      # And the other half of that decision: arrow stays separable, so a consumer that
      # only needs CSV can drop ~60 crates. A feature nobody checks stops working.
      - name: quokka-spool without parquet has no arrow
        run: |
          set -euo pipefail
          cargo build --package quokka-spool --no-default-features
          tree=$(cargo tree --package quokka-spool --no-default-features --edges normal)
          if grep -Eiq '\b(arrow|arrow-array|arrow-schema|parquet|thrift)\b' <<<"$tree"; then
            echo "::error::arrow reached a build that switched parquet off:"
            grep -Ei '\b(arrow|arrow-array|arrow-schema|parquet|thrift)\b' <<<"$tree"
            exit 1
          fi
          echo "the no-parquet spool tree is clean"

      # The drivers are not behind a CLI feature, so the headless build is a full
      # database client rather than a SQLite-only one. Checking it here keeps that a
      # decision rather than an accident.
      - name: the headless build still carries every driver
        run: |
          set -euo pipefail
          tree=$(cargo tree --package quokkaquery --no-default-features --edges normal)
          for driver in sqlite postgres mysql; do
            if ! grep -q "sqlx-$driver" <<<"$tree"; then
              echo "::error::the headless build dropped the $driver driver"
              exit 1
            fi
          done
          echo "headless tree carries sqlite, postgres and mysql"

  msrv:
    name: builds on the declared rust-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Keep this in step with `rust-version` in the workspace Cargo.toml. An MSRV
      # nobody checks quietly stops being true — this one already had.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features
